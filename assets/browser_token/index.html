<!doctype html>
<html><head><meta charset="utf-8"></head><body><script>
// Gives the app a random token kept in this browser, so it can find this browser's work after a refresh.
function tell(type, data) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*"); }
function token() {
  try {
    let value = localStorage.getItem("cs_session");
    if (!value) {
      value = crypto.randomUUID().replaceAll("-", "");
      localStorage.setItem("cs_session", value);
    }
    return value;
  } catch (e) { return null; }  // storage blocked: the app simply works without restoring
}
let sent = false;
window.addEventListener("message", e => {
  if (e.data.type !== "streamlit:render" || sent) return;
  sent = true;
  tell("streamlit:setFrameHeight", {height: 0});
  tell("streamlit:setComponentValue", {value: token(), dataType: "json"});
});
tell("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
